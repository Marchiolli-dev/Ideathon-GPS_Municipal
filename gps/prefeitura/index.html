<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocorrências da prefeitura</title><link rel="stylesheet" href="/style.css"><style>
main{max-width:38rem;margin:auto;padding:22px 16px}form,article{background:var(--surface);border:1px solid #CBD9DC;border-radius:12px;padding:16px;margin:12px 0}form{gap:12px}header a{color:var(--surface)}article p{margin:6px 0 12px}h2{margin-top:20px}#mensagem{min-height:1.5em}
.marca{background:#164B56;justify-content:center;padding:16px}.marca img{display:block;width:min(100%,420px);height:auto}</style></head><body><header class="marca"><button type="button" class="abrir-acessibilidade" aria-label="Prefeitura de Araçatuba — abrir acessibilidade" aria-haspopup="dialog" aria-expanded="false" aria-controls="acessibilidade"><img src="/logo_aracatuba_topo.png" alt="Prefeitura de Araçatuba"></button></header>
<main><h2>Registrar ocorrência</h2><form id="cadastro"><label>Rua<select id="rua" required></select></label><label>Trecho afetado<select id="trecho" required></select></label><label>Tipo de ocorrência<select id="tipo"><option>Obras</option><option>Acidente</option><option>Alagamento</option><option>Trânsito lento</option><option>Engarrafamento</option><option>Outro</option></select></label><label>Impacto no trajeto<select id="peso"><option value="60">Baixo · 1 minuto</option><option value="300">Médio · 5 minutos</option><option value="500" selected>Alto · 8 min e 20 s</option></select></label><button id="salvar" disabled>Registrar ocorrência</button></form>
<p role="status" id="mensagem"></p><h2>Ocorrências ativas</h2><div id="lista">Carregando…</div></main><script type="module" src="/prefeitura.js"></script><dialog id="acessibilidade" aria-labelledby="titulo-acessibilidade">
<h2 id="titulo-acessibilidade">Acessibilidade</h2>
<label for="tamanho-texto">Tamanho do texto</label>
<select id="tamanho-texto"><option value="normal">Normal</option><option value="grande">Grande</option><option value="maior">Maior</option></select>
<label class="opcao-contraste"><input type="checkbox" id="alto-contraste"> Alto contraste</label>
<button type="button" id="restaurar-acessibilidade" class="secondary">Restaurar padrão</button>
<form method="dialog"><button>Fechar</button></form>
</dialog><script type="module" src="/acessibilidade.js"></script></body></html>
